name: Deploy to VPS

on:
  push:
    branches:
      - main

# One deploy at a time per repo. (The VPS also takes a lock of its own, so two repos deploying to the
# same server queue up instead of colliding.)
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          # Abort (and fail the workflow) the moment any command below errors.
          script_stop: true
          script: |
            set -e
            cd ~/NODE-HOTELIER
            # Fetch and take ONLY the deploy script from the new commit. The live folder is otherwise
            # left alone: the script builds the new version in a staging copy, keeps the old code
            # running the whole time, and only swaps it in (with an automatic rollback) once the new
            # build succeeded and is healthy. A failed deploy therefore never takes the server down.
            git update-ref -d refs/remotes/origin/main || true
            git fetch --prune --force origin +refs/heads/main:refs/remotes/origin/main
            git checkout origin/main -- scripts/deploy.sh
            bash scripts/deploy.sh
