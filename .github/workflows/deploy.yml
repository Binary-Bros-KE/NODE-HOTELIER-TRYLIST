name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Abort (and fail the workflow) the moment any command below errors,
          # instead of ploughing on and reporting a green "deploy" that did
          # nothing.
          script_stop: true
          script: |
            set -e
            cd ~/NODE-HOTELIER
            # A deploy checkout owns no local edits worth keeping — force it
            # to exactly match origin/main. `.env`, node_modules/, dist/ and
            # uploads/ are gitignored, so they survive this.
            # Repair stale/corrupt remote-tracking refs before fetching. A
            # failed/concurrent deploy can leave origin/main in a state where
            # git refuses to lock it, which blocks the whole live deploy.
            git update-ref -d refs/remotes/origin/main || true
            git fetch --prune --force origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            # If a previous npm install was interrupted, node_modules can be
            # left half-mutated (for example missing iconv-lite encodings).
            # Move it out of the app folder instead of deleting in place; on
            # this VPS npm/rm can hit ENOTEMPTY while cleaning deep package
            # folders, and npm ci then tries to clean the broken tree again.
            pm2 stop hotelier-server || true
            stale_node_modules="../NODE-HOTELIER-node_modules-stale-$(date +%s)"
            if [ -d node_modules ]; then
              mv node_modules "$stale_node_modules"
            fi
            # `npm ci` installs from package-lock.json without rewriting it,
            # so it can never drift and block the next `git` step.
            npm ci
            rm -rf "$stale_node_modules" || true
            # Explicit, even though "postinstall" already runs this — on this
            # host `npm ci` doesn't reliably fire lifecycle scripts, so a
            # schema change silently built against a stale generated client
            # and failed `tsc` with errors pointing at fields/models that no
            # longer exist. This has no DB dependency, so it's safe here
            # even before migrate deploy has run.
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart hotelier-server --update-env
